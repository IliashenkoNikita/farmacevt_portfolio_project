services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://holos:holos@postgres:5432/holos_bpr
      AUTH_SECRET: local-docker-auth-secret-minimum-32-characters
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CERTIFICATE_SIGNING_SECRET: local-docker-certificate-secret-32-chars
      RATE_LIMIT_SECRET: local-docker-rate-limit-secret-32-chars
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: no-reply@example.test
      EMAIL_SERVER_HOST: localhost
      EMAIL_SERVER_PORT: "1025"
      EMAIL_FROM: no-reply@example.test
      FILE_STORAGE_PROVIDER: local
      FILE_STORAGE_PATH: /app/uploads
      FILE_STORAGE_BUCKET: ""
      FILE_STORAGE_ACCESS_KEY: ""
      FILE_STORAGE_SECRET_KEY: ""
      SENTRY_DSN: ""
      HEALTHCHECK_SECRET: ""
      SMS_PROVIDER_KEY: ""
      VIBER_PROVIDER_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: holos
      POSTGRES_PASSWORD: holos
      POSTGRES_DB: holos_bpr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holos -d holos_bpr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
